name: Brain Chat Interface

on:
  push:
    paths:
      - 'question.txt' # يعمل فقط عندما تقوم بتعديل ملف السؤال

permissions:
  contents: write

jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Process Question (Generative Brain)
        # هنا نستخدم السكربت التوليدي الجديد
        run: python scripts/generative_chat.py
        
      - name: Commit the Answer to the Repository
        run: |
          git config --global user.name "Brain-Sim Bot"
          git config --global user.email "bot@brain-sim.com"
          git add answer.txt chat_history.md
          git commit -m "💬 Generative Brain replied to a new question" || echo "No changes"
          git pull --rebase origin main
          git push origin main
