name: Wake Phase - Train & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  wake-training:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [ "MNIST-A", "MNIST-B" ] # محاكاة مهام متسلسلة
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Wake Training (Task ${{ matrix.task }})
        run: python scripts/train_wake.py --task ${{ matrix.task }}
        
      - name: Run Plasticity Tests
        run: pytest tests/test_plasticity.py -v
        
      # هذا هو السطر الجديد الذي أضفناه لاختبار البيئة التفاعلية
      - name: Run Interactive Environment
        run: python scripts/train_environment.py
