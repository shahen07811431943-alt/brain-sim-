name: Wake Phase - Train & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # يعمل تلقائياً كل يوم منتصف الليل ليتعلم ويتوسع

# ضروري جداً للسماح لـ GitHub Actions بالحفظ في المستودع
permissions:
  contents: write

jobs:
  wake-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ضروري لعملية git pull --rebase
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Wake Training
        run: python scripts/train_wake.py --task MNIST-A
        
      - name: Run Plasticity Tests
        run: pytest tests/test_plasticity.py -v
        
      - name: Run Interactive Environment
        run: python scripts/train_environment.py
        
      - name: Run Visual Perception
        run: python scripts/train_vision.py
        
      - name: Run Predictive Coding
        run: python scripts/train_predictive.py
        
      - name: Run Multimodal Binding
        run: python scripts/train_multimodal.py
        
      - name: Run Integrated Brain
        run: python scripts/train_integrated_brain.py
        
      - name: Run Global Brain (Read & Answer)
        run: python scripts/global_brain.py
        
      - name: Run Autonomous Professor
        run: python scripts/self_learning_professor.py

      # الخطوة الجديدة: بناء الذاكرة المتجهة
      - name: Run Smart Memory (Vector Database)
        run: python scripts/smart_memory.py
      
      # الحفظ التلقائي في المستودع
      - name: Commit and Push Memory Database
        run: |
          git config --global user.name "Brain-Sim Bot"
          git config --global user.email "bot@brain-sim.com"
          git add brain_vectors.json
          git commit -m "🧠 Brain automatically updated its vector memory" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
