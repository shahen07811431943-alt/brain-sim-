name: Sleep Phase - Consolidate & Prevent Forgetting

on:
  schedule:
    - cron: '0 2 * * *' # كل يوم الساعة 2 صباحاً
  workflow_dispatch: # السماح بالتشغيل اليدوي

jobs:
  sleep-consolidation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Sleep Cycle (Replay & Consolidate)
        run: python scripts/run_sleep_cycle.py
        
      - name: Run Forgetting Test
        run: python scripts/test_forgetting.py
